---
# ============================================================================
# atc.yml — single source of truth for the ATC subsystem
# Consumed by roles atc_inject, atc_core, atc_weather, atc_cwp.
# Grounded in docs/atc_cyber_range_project_design_document.md (§4, §8).
# ============================================================================

# --- Host addressing (prod IPs; mgmt IPs live in host_vars) -----------------
atc_radar_ip:   "172.31.5.10"     # atc-radar   — feed + readsb + tar1090 + FDP
atc_station_ip: "172.31.5.12"     # atc-station — CWP kiosk + display
atc_weather_ip: "172.31.5.11"     # atc-weather — METAR/TAF feed

# The platform assigns the prod NIC a /32, so the rest of the FCC subnet is
# unreachable without an explicit on-link route — common installs one.
atc_prod_interface: "eth1"
atc_prod_subnet: "172.31.5.0/24"

# --- Install paths ----------------------------------------------------------
atc_root: "/opt/atc"
atc_venv: "/opt/atc/venv"         # Python venv for the feed + FDP + weather
atc_user: "atc"                   # service account (created by common/role)

# --- Python sourcing (dev = public PyPI via proxy; air-gap = ng_pypi) --------
atc_pip_index_url: ""             # "" → default PyPI; set to nexus_pypi_index for air-gap
atc_pip_trusted_host: "{{ nexus_host }}"

# --- Exercise clock (epoch-based; survives restarts; range-wide) ------------
# cycle_position = (now_utc - atc_exercise_epoch) % atc_cycle_seconds
# Pick a FIXED epoch and keep it identical across any coupled system (weather,
# and the fuel farm in the full range) so movements line up. Default 48 h to
# match the airfield replay convention.
atc_exercise_epoch: "2026-01-01T00:00:00Z"
atc_cycle_seconds: 172800         # 48 h
atc_cycle_wrap_gap_seconds: 60    # clean "end of window" gap before restart

# --- ADS-B feed (design §2, §4A) --------------------------------------------
# Primary = Beast DF17 on :30005 (real frames); SBS/BaseStation :30003 is a
# secondary human-readable output. Feed binds 0.0.0.0, multi-client.
atc_feed_bind: "0.0.0.0"
atc_feed_beast_port: 30005
atc_feed_sbs_port: 30003
atc_feed_rate_hz: 1               # position update rate
atc_primary_radar_enabled: false  # optional independent feed for cross-check detections

# --- readsb (design §4B) ----------------------------------------------------
# Pinned .deb from Nexus ng_raw for air-gap; dev may install from a staged
# .deb. readsb runs network-only (no SDR), pulling the local Beast feed.
# Sourcing: DEV installs readsb from upstream over the internet (range has
# egress); AIR-GAP installs a pinned .deb from Nexus ng_raw. Flip the method
# and set the .deb URL for air-gapped ranges. Either way Ansible owns
# /etc/default/readsb — no community script decides config.
atc_readsb_install_method: "upstream_script"   # upstream_script (dev) | nexus_deb (air-gap)
atc_readsb_install_url: "https://github.com/wiedehopf/adsb-scripts/raw/master/readsb-install.sh"
atc_readsb_deb_url: ""            # air-gap: the ng_raw .deb URL once staged
# The feed emits Beast DF17 on :30005 (+ SBS on :30003 for taps); readsb ingests
# Beast. (Fallback for debugging: "127.0.0.1,{{ atc_feed_sbs_port }},sbs_in".)
atc_readsb_net_connector: "127.0.0.1,{{ atc_feed_beast_port }},beast_in"
atc_readsb_disable_aircraft_db: true   # AE… hex codes must NOT map to real airframes

# --- tar1090 (design §4B) ---------------------------------------------------
# DEV installs from upstream (wiedehopf); AIR-GAP vendors from Nexus ng_raw.
atc_tar1090_install_method: "upstream_script"   # upstream_script (dev) | nexus (air-gap)
atc_tar1090_install_url: "https://github.com/wiedehopf/tar1090/raw/master/install.sh"
atc_tar1090_web: "lighttpd"       # tar1090's shipped default
atc_tar1090_config: "/usr/local/share/tar1090/html/config.js"   # verify path on host
atc_tar1090_default_zoom: 11
atc_tar1090_range_rings_nm: [10, 20, 40]
# Map basemap: the ATC hosts have no browser egress, so OSM won't load. Without
# a local tileset the scope still renders aircraft/trails/range-rings on a dark
# background (fine for dev). Staging an offline tileset from ng_raw is the
# air-gap polish item.
atc_tar1090_offline_tiles: true
# tar1090's BUILT-IN offline layer (enabled by offlineMapDetail>0 = max zoom).
# Its lighttpd conf ALIASES /tar1090/osm_tiles_offline/ to
# /usr/local/share/osm_tiles_offline/ (NOT under html/) — tiles must live there.
atc_tar1090_tiles_dir: "/usr/local/share/osm_tiles_offline"
atc_tar1090_tiles_url: "/tar1090/osm_tiles_offline/{z}/{x}/{y}.png"
# DEV tile source, fetched via the mgmt proxy (the hosts have no browser egress,
# so tiles are served LOCALLY). AIR-GAP: stage this same {z}/{x}/{y}.png set to
# Nexus and point atc_tiles_src at it. Respect the source's usage policy — this
# is a bounded, one-time dev fetch.
atc_tiles_src: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
atc_tiles_bbox: { lat_min: 37.0, lat_max: 40.0, lon_min: -80.0, lon_max: -77.0 }
atc_tiles_zoom_min: 6
atc_tiles_zoom_max: 11

# --- Flight Data Processor (design §4C) -------------------------------------
atc_fdp_port: 8080
atc_fdp_admin_password: "{{ vault_fdp_admin_password }}"
atc_fdp_api_token: "{{ vault_fdp_api_token }}"
# Deliberate range vulnerabilities — DEFAULT SECURE. Each is marked
# `# RANGE-VULN:` in code and documented in the instructor answer key.
atc_vulns_enabled: false
# Fuel-requisition link (design §4D) — OFF in the dev range (no fuel farm here).
# When enabled in the full range it points at the requisition broker, never the
# OT DB directly.
atc_fuel_requisition_enabled: false
atc_fuel_requisition_url: ""

# --- Weather (sibling; ATC consumes METAR/TAF at the display) ---------------
atc_weather_port: 8081
atc_weather_protocol: "http"      # http endpoint the FDP/CWP polls

# --- Airfield parameters (FICTIONAL — design §8; not a real field) ----------
atc_airfield:
  ident_icao: "KBAX"
  ident_faa:  "BAX"
  name:       "Blackstone Auxiliary Field"
  lat:         38.5000
  lon:        -78.5000
  field_elev_ft: 520
  mag_var_deg:  -9.0
  pattern_alt_ft_agl: 1000
  runways:
    - { ident: "02/20", true_hdg: 20,  length_ft: 8000, surface: "asphalt" }
    - { ident: "11/29", true_hdg: 110, length_ft: 5000, surface: "asphalt" }
  nav_fixes: []

# Path to the generated schedule (bundled under sim-data/atc, staged by atc_inject)
atc_schedule_src: "sim-data/atc/schedule.json"
